<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClassLink — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --indigo: #4F46E5; --indigo-dark: #3730A3;
      --text: #0f0f1a; --muted: #6b7280;
      --border: #e5e7eb; --bg: #f8f7ff;
      --white: #ffffff; --error: #ef4444; --success: #10b981;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed;
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(79,70,229,0.12) 0%, transparent 70%);
      top: -200px; right: -200px; pointer-events: none;
    }
    body::after {
      content: ''; position: fixed;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
      bottom: -100px; left: -100px; pointer-events: none;
    }
    .card {
      background: var(--white); border-radius: 24px;
      padding: 48px 44px; width: 100%; max-width: 440px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 40px rgba(79,70,229,0.08);
      position: relative; z-index: 1;
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .logo-icon {
      width: 40px; height: 40px; background: var(--indigo);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
    }
    .logo-text { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--text); }
    h1 { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 32px; font-weight: 300; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--text); background: var(--white); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    input::placeholder { color: #d1d5db; }
    input.error { border-color: var(--error); }
    .btn {
      width: 100%; padding: 13px; background: var(--indigo);
      color: white; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif;
      cursor: pointer; margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--indigo-dark); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert {
      padding: 12px 14px; border-radius: 10px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .alert.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    .alert.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
    .switch a { color: var(--indigo); text-decoration: none; font-weight: 500; }
    .switch a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="4" fill="white"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">ClassLink</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your school network</p>

    <div class="alert" id="alert"></div>

    <form id="form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="@yourname" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn" id="btn">Sign in</button>
    </form>

    <div class="switch">Don't have an account? <a href="signup.html">Sign up</a></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const alert = document.getElementById('alert');
    const btn = document.getElementById('btn');

    function showAlert(msg, type) {
      alert.textContent = msg;
      alert.className = 'alert ' + type;
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showAlert('Please fill in all fields.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          showAlert('Signed in! Redirecting...', 'success');
          setTimeout(() => window.location.href = 'home.html', 800);
        } else {
          showAlert(data.error || 'Something went wrong.', 'error');
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      } catch (err) {
        showAlert('Could not connect to server. Is Flask running?', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
