<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClassLink — Profile Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --indigo: #4F46E5; --indigo-dark: #3730A3;
      --text: #0f0f1a; --muted: #6b7280;
      --border: #e5e7eb; --bg: #f8f7ff;
      --white: #ffffff; --error: #ef4444; --success: #10b981;
    }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 40px 16px; position: relative;
    }
    body::before {
      content: ''; position: fixed; width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(79,70,229,0.12) 0%, transparent 70%);
      top: -200px; right: -200px; pointer-events: none;
    }
    .card {
      background: var(--white); border-radius: 24px; padding: 48px 44px;
      width: 100%; max-width: 480px; border: 1px solid var(--border);
      box-shadow: 0 4px 40px rgba(79,70,229,0.08);
      position: relative; z-index: 1; animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-icon {
      width: 40px; height: 40px; background: var(--indigo);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
    }
    .logo-text { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--text); }
    .steps { display: flex; gap: 6px; align-items: center; margin-bottom: 24px; }
    .step { width: 28px; height: 4px; border-radius: 2px; background: var(--border); }
    .step.active { background: var(--indigo); }
    .step-text { font-size: 12px; color: var(--muted); margin-left: 4px; }
    h1 { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 28px; font-weight: 300; }
    .section-label {
      font-size: 11px; font-weight: 500; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--muted); margin: 20px 0 10px;
    }
    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
    .optional { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
    .input-row {
      display: flex; align-items: center; gap: 0;
      border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: var(--white);
    }
    .input-row:focus-within {
      border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }
    .input-prefix {
      padding: 11px 12px; font-size: 13px; font-weight: 500;
      background: #f3f4f6; border-right: 1px solid var(--border);
      color: var(--muted); white-space: nowrap; min-width: 90px; text-align: center;
    }
    .input-prefix.ig   { color: #E1306C; }
    .input-prefix.tt   { color: #111; }
    .input-prefix.sc   { color: #FFBE00; }
    .input-prefix.dc   { color: #5865F2; }
    .input-prefix.ph   { color: #25D366; }
    input[type="text"],
    input[type="tel"] {
      flex: 1; padding: 11px 12px; border: none; outline: none;
      font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text);
      background: transparent;
    }
    input[type="text"]::placeholder,
    input[type="tel"]::placeholder { color: #d1d5db; }
    .plain-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 12px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--text); background: var(--white); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .plain-input:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .plain-input::placeholder { color: #d1d5db; }
    .alert {
      padding: 12px 14px; border-radius: 10px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .alert.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    .alert.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .btn {
      width: 100%; padding: 13px; background: var(--indigo);
      color: white; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif;
      cursor: pointer; margin-top: 20px; transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--indigo-dark); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .skip { text-align: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
    .skip a { color: var(--indigo); text-decoration: none; }
    .skip a:hover { text-decoration: underline; }

    /* Avatar uploader */
    .avatar-wrap {
      display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; gap: 10px;
    }
    .avatar-ring {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--indigo-light, #EEF2FF); color: var(--indigo);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700;
      cursor: pointer; position: relative; overflow: hidden;
      border: 2.5px dashed var(--indigo); transition: opacity 0.2s;
    }
    .avatar-ring:hover { opacity: 0.85; }
    .avatar-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .avatar-ring .camera-overlay {
      position: absolute; inset: 0; background: rgba(79,70,229,0.55);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s; border-radius: 50%;
    }
    .avatar-ring:hover .camera-overlay { opacity: 1; }
    .avatar-hint { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="4" fill="white"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">ClassLink</span>
    </div>

    <div class="steps">
      <div class="step"></div>
      <div class="step active"></div>
      <span class="step-text">Step 2 of 2 — your profile</span>
    </div>

    <h1>Fill in your profile</h1>
    <p class="subtitle">Help your classmates find and connect with you</p>

    <div class="alert" id="alert"></div>

    <!-- Avatar uploader -->
    <div class="avatar-wrap">
      <div class="avatar-ring" id="avatar-ring" onclick="document.getElementById('avatar-input').click()">
        <span id="avatar-initials">?</span>
        <div class="camera-overlay">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="4" stroke="white" stroke-width="2"/>
          </svg>
        </div>
      </div>
      <span class="avatar-hint">Click to add a photo</span>
      <input type="file" id="avatar-input" accept="image/*" style="display:none"/>
    </div>

    <form id="form" novalidate>
      <p class="section-label">Basic info</p>

      <div class="form-group">
        <label for="full_name">Full name</label>
        <input class="plain-input" type="text" id="full_name" placeholder="Your real name"/>
      </div>
      <div class="form-group">
        <label for="grade">Grade <span class="optional">(optional)</span></label>
        <input class="plain-input" type="text" id="grade" placeholder="e.g. 10th, 11th, Senior"/>
      </div>
      <div class="form-group">
        <label for="school">School name</label>
        <input class="plain-input" type="text" id="school" placeholder="e.g. Lincoln High School"/>
      </div>

      <hr/>
      <p class="section-label">Socials &amp; contact <span class="optional" style="text-transform:none;letter-spacing:0">(all optional)</span></p>

      <div class="form-group">
        <label>Instagram</label>
        <div class="input-row">
          <span class="input-prefix ig">Instagram</span>
          <input type="text" id="instagram" placeholder="@username"/>
        </div>
      </div>
      <div class="form-group">
        <label>TikTok</label>
        <div class="input-row">
          <span class="input-prefix tt">TikTok</span>
          <input type="text" id="tiktok" placeholder="@username"/>
        </div>
      </div>
      <div class="form-group">
        <label>Snapchat</label>
        <div class="input-row">
          <span class="input-prefix sc">Snapchat</span>
          <input type="text" id="snapchat" placeholder="@username"/>
        </div>
      </div>
      <div class="form-group">
        <label>Discord</label>
        <div class="input-row">
          <span class="input-prefix dc">Discord</span>
          <input type="text" id="discord" placeholder="username or username#1234"/>
        </div>
      </div>
      <div class="form-group">
        <label>Phone number</label>
        <div class="input-row">
          <span class="input-prefix ph">Phone</span>
          <input type="tel" id="phone" placeholder="+1 (000) 000-0000"/>
        </div>
      </div>

      <button type="submit" class="btn" id="btn">Finish setup — go to home feed →</button>
    </form>

    <div class="skip"><a href="home.html">Skip for now</a></div>
  </div>

  <script>
    const form    = document.getElementById('form');
    const alertEl = document.getElementById('alert');
    const btn     = document.getElementById('btn');
    let avatarDataUrl = null;

    function showAlert(msg, type) {
      alertEl.textContent = msg;
      alertEl.className = 'alert ' + type;
    }

    // Update initials placeholder from name field
    document.getElementById('full_name').addEventListener('input', function() {
      if (!avatarDataUrl) {
        const name = this.value.trim();
        const parts = name.split(' ').filter(Boolean);
        const ini = parts.length >= 2
          ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
          : (parts[0] ? parts[0].slice(0,2).toUpperCase() : '?');
        document.getElementById('avatar-initials').textContent = ini;
      }
    });

    // Handle image selection — resize to 200×200 via canvas, show preview
    document.getElementById('avatar-input').addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = 200; canvas.height = 200;
          const ctx = canvas.getContext('2d');
          // Cover-crop to square
          const size = Math.min(img.width, img.height);
          const sx = (img.width - size) / 2;
          const sy = (img.height - size) / 2;
          ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200);
          avatarDataUrl = canvas.toDataURL('image/jpeg', 0.85);
          // Show preview
          const ring = document.getElementById('avatar-ring');
          ring.innerHTML = `<img src="${avatarDataUrl}" alt="avatar"/>
            <div class="camera-overlay">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="13" r="4" stroke="white" stroke-width="2"/>
              </svg>
            </div>`;
          ring.style.border = '2.5px solid var(--indigo)';
          ring.onclick = () => document.getElementById('avatar-input').click();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const full_name = document.getElementById('full_name').value.trim();
      const school    = document.getElementById('school').value.trim();

      if (!full_name) return showAlert('Please enter your full name.', 'error');
      if (!school)    return showAlert('Please enter your school name.', 'error');

      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        // Upload avatar first if one was selected
        if (avatarDataUrl) {
          const avatarRes = await fetch('/api/upload-avatar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ avatar_data: avatarDataUrl })
          });
          if (!avatarRes.ok) {
            const d = await avatarRes.json();
            showAlert(d.error || 'Avatar upload failed.', 'error');
            btn.disabled = false;
            btn.textContent = 'Finish setup — go to home feed →';
            return;
          }
        }

        // Save profile
        const res = await fetch('/api/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name,
            grade:     document.getElementById('grade').value.trim(),
            school,
            instagram: document.getElementById('instagram').value.trim(),
            tiktok:    document.getElementById('tiktok').value.trim(),
            snapchat:  document.getElementById('snapchat').value.trim(),
            discord:   document.getElementById('discord').value.trim(),
            phone:     document.getElementById('phone').value.trim(),
          })
        });
        const data = await res.json();

        if (res.ok) {
          showAlert('Profile saved! Taking you home...', 'success');
          setTimeout(() => window.location.href = 'home.html', 800);
        } else {
          showAlert(data.error || 'Something went wrong.', 'error');
          btn.disabled = false;
          btn.textContent = 'Finish setup — go to home feed →';
        }
      } catch (err) {
        showAlert('Could not connect to server. Is Flask running?', 'error');
        btn.disabled = false;
        btn.textContent = 'Finish setup — go to home feed →';
      }
    });
  </script>
</body>
</html>
